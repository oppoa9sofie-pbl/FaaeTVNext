
name: Build FaaeTV Next APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o FaaeTVNext-Android-Source.zip
          ls -la

      - name: Fix Java Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("FaaeTVNext-Android/app").glob("build.gradle*"))
          if not files:
              raise SystemExit("App Gradle file not found")

          for p in files:
              s = p.read_text()
              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
              p.write_text(s)
              print("Updated:", p)
          PY
          
      - name: Build APK
        working-directory: FaaeTVNext-Android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaaeTVNext-APK
          path: FaaeTVNext-Android/app/build/outputs/apk/debug/app-debug.apk
          
